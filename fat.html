<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>지방 음식 데이터베이스</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

h1{
text-align:center;
}

#search{
width:320px;
padding:10px;
margin:20px auto;
display:block;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#2f3640;
color:white;
}

tr:hover{
background:#f1f2f6;
}

</style>

</head>

<body>

<h1>🧈 지방 음식 데이터베이스 (10g 기준)</h1>

<input type="text" id="search" placeholder="음식 검색..." onkeyup="searchFood()">

<table id="foodTable">

<tr>
<th>음식</th>
<th>지방(g)</th>
<th>단백질(g)</th>
<th>탄수화물(g)</th>
<th>칼로리</th>
</tr>

</table>

<script>

const foods=[

["라드",100,0,0,900],
["버터",81,1,0,717],
["마가린",80,0,0,717],
["올리브오일",100,0,0,884],
["카놀라유",100,0,0,884],
["해바라기유",100,0,0,884],
["코코넛오일",100,0,0,892],
["참기름",100,0,0,884],
["아보카도오일",100,0,0,884],

["마요네즈",75,1,1,680],
["샐러드드레싱",70,1,3,620],

["돼지 비계",90,2,0,800],
["삼겹살",37,17,0,518],
["항정살",41,18,0,520],
["목살",20,22,0,280],
["소고기 등심",20,25,0,271],
["소고기 채끝",18,24,0,260],
["소고기 갈비",28,22,0,350],

["오리 고기",28,19,0,337],
["닭다리살",8,23,0,209],
["닭날개",19,30,0,290],

["베이컨",42,12,1,458],
["소시지",27,16,2,301],
["살라미",33,22,1,407],

["연어",13,25,0,208],
["고등어",13,20,0,205],
["꽁치",15,20,0,230],
["참치",1,29,0,132],
["대구",0.7,24,0,105],

["치즈",33,25,1,402],
["체다치즈",33,25,1,403],
["모짜렐라",22,22,3,300],
["크림치즈",34,6,4,342],

["계란 프라이",11,13,1,196],
["삶은 계란",11,13,1,155],

["아보카도",15,2,9,160],

["아몬드",49,21,22,579],
["호두",65,15,14,654],
["캐슈넛",44,18,30,553],
["피스타치오",45,20,28,562],
["마카다미아",76,8,14,718],
["브라질넛",66,14,12,659],
["피칸",72,9,14,691],

["땅콩버터",50,25,20,588],

["초콜릿",31,7,59,546],
["다크초콜릿",43,8,46,600],

["프렌치프라이",15,3,41,312],
["감자칩",35,7,53,536]

];

foods.sort((a,b)=>b[1]-a[1]);

const table=document.getElementById("foodTable");

foods.forEach(food=>{

let row=table.insertRow();

row.insertCell(0).innerText=food[0];
row.insertCell(1).innerText=food[1];
row.insertCell(2).innerText=food[2];
row.insertCell(3).innerText=food[3];
row.insertCell(4).innerText=food[4];

});

function searchFood(){

let input=document.getElementById("search").value.toLowerCase();
let tr=table.getElementsByTagName("tr");

for(let i=1;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[0];

if(td){

let txt=td.textContent||td.innerText;

if(txt.toLowerCase().indexOf(input)>-1){
tr[i].style.display="";
}else{
tr[i].style.display="none";
}

}

}

}

</script>

</body>
</html>
