<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지방 식품 영양표 (10g 기준)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }
        
        .food-icon {
            font-size: 2.5em;
            margin-right: 15px;
        }
        
        .food-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .nutrition-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .nutrition-item:last-child {
            border-bottom: none;
        }
        
        .nutrition-label {
            color: #666;
            font-weight: 500;
        }
        
        .nutrition-value {
            color: #333;
            font-weight: bold;
        }
        
        .category-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .category-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .category-icon {
            font-size: 1.2em;
            margin-right: 10px;
        }
        
        .category-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .category-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .highlight-omega3 {
            background-color: #e3f2fd;
            padding: 2px 6px;
            border-radius: 4px;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥑 지방 식품 영양표 (10g 기준)</h1>
        
        <div class="grid" id="nutritionGrid"></div>
        
        <div class="category-section">
            <div class="category-title"><span class="category-icon">🌿</span>식물성 오일</div>
            <div class="category-items" id="oils"></div>
        </div>
        
        <div class="category-section">
            <div class="category-title"><span class="category-icon">🥜</span>견과류</div>
            <div class="category-items" id="nuts"></div>
        </div>
        
        <div class="category-section">
            <div class="category-title"><span class="category-icon">🐟</span>생선 (오메가-3 풍부)</div>
            <div class="category-items" id="fish"></div>
        </div>
        
        <div class="category-section">
            <div class="category-title"><span class="category-icon">🌾</span>씨앗류</div>
            <div class="category-items" id="seeds"></div>
        </div>
        
        <div class="category-section">

        // 영양표 카드 생성
        const grid = document.getElementById('nutritionGrid');
        for (const [food, data] of Object.entries(fatNutrition)) {
            const card = document.createElement('div');
            card.className = 'card';
            
            let nutritionItems = '';
            for (const [key, value] of Object.entries(data)) {
                if (key !== 'icon' && key !== 'category') {
                    const highlightClass = key === '오메가-3' ? ' class="highlight-omega3"' : '';
                    nutritionItems += `
                        <div class="nutrition-item">
                            <span class="nutrition-label">${key}</span>
                            <span class="nutrition-value"${highlightClass}>${value}</span>
                        </div>
                    `;
                }
            }
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="food-icon">${data.icon}</div>
                    <div class="food-name">${food}</div>
                </div>
                ${nutritionItems}
            `;
            
            grid.appendChild(card);
        }

        // 카테고리별 분류
        const categories = {
            oils: document.getElementById('oils'),
            nuts: document.getElementById('nuts'),
            fish: document.getElementById('fish'),
            seeds: document.getElementById('seeds'),
            animalFats: document.getElementById('animalFats')
        };

        for (const [food, data] of Object.entries(fatNutrition)) {
            const tag = document.createElement('div');
            tag.className = 'category-tag';
            tag.textContent = `${data.icon} ${food}`;
            categories[data.category].appendChild(tag);
        }

</html>
